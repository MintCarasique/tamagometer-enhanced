name: Test, build, and release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  desktop-tests:
    name: Desktop tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: desktop/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run unit tests
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -v 2>&1 | tee test-output.log
          status=${PIPESTATUS[0]}
          set -e
          if (( status != 0 )); then
            failure="$(tail -n 50 test-output.log)"
            failure="${failure//'%'/'%25'}"
            failure="${failure//$'\r'/'%0D'}"
            failure="${failure//$'\n'/'%0A'}"
            echo "::error title=Unit test failure::$failure"
            exit "$status"
          fi

      - name: Lint QML sources
        run: find tamagometer_desktop/qt/qml -name '*.qml' -print0 | xargs -0 pyside6-qmllint

      - name: Compile Python sources
        run: python -m compileall -q .

  desktop-exe:
    name: Build Windows application
    needs: desktop-tests
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: desktop/requirements-dev.txt

      - name: Install build dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Build standalone executable
        run: python tools/build_desktop.py --mode onefile --dist-dir ../release --clean

      - name: Smoke test packaged application
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $executable = Resolve-Path ../release/TamagometerDesktop.exe
          $process = Start-Process -FilePath $executable -WindowStyle Hidden -PassThru
          Start-Sleep -Seconds 10
          if ($process.HasExited) {
            throw "Packaged application exited during startup with code $($process.ExitCode)"
          }
          Get-Process -Name TamagometerDesktop -ErrorAction SilentlyContinue | Stop-Process -Force

      - name: Check release size
        shell: pwsh
        run: |
          $artifact = Get-Item ../release/TamagometerDesktop.exe
          Write-Host "Windows artifact: $([math]::Round($artifact.Length / 1MB, 1)) MiB"
          if ($artifact.Length -gt 220MB) {
            throw "Windows artifact exceeded the 220 MiB release guardrail"
          }

      - name: Include third-party notices
        shell: pwsh
        run: Copy-Item THIRD_PARTY_NOTICES.md ../release/THIRD_PARTY_NOTICES.md

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: TamagometerDesktop-windows
          path: |
            release/TamagometerDesktop.exe
            release/THIRD_PARTY_NOTICES.md
          if-no-files-found: error
          retention-days: 14

  flipper-fap:
    name: Build Flipper application
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and Flipper submodule
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build FAP with the official release SDK
        uses: flipperdevices/flipperzero-ufbt-action@v0.1
        with:
          app-dir: flipper
          sdk-channel: release

      - name: Prepare named FAP
        shell: bash
        run: |
          mkdir -p release
          source_fap="$(find flipper/dist -maxdepth 1 -type f -name '*.fap' -print -quit)"
          test -n "$source_fap"
          cp "$source_fap" release/tamagometer_enhanced.fap

      - name: Upload Flipper artifact
        uses: actions/upload-artifact@v7
        with:
          name: TamagometerEnhanced-flipper
          path: release/tamagometer_enhanced.fap
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - desktop-exe
      - flipper-fap
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: TamagometerDesktop-windows
          path: release

      - name: Download Flipper artifact
        uses: actions/download-artifact@v8
        with:
          name: TamagometerEnhanced-flipper
          path: release

      - name: Generate checksums
        working-directory: release
        run: sha256sum TamagometerDesktop.exe tamagometer_enhanced.fap THIRD_PARTY_NOTICES.md > SHA256SUMS.txt

      - name: Extract readable release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release/RELEASE_NOTES.md
          if [[ ! -s release/RELEASE_NOTES.md ]]; then
            echo "CHANGELOG.md has no release section for $version" >&2
            exit 1
          fi

      - name: Create release and upload binaries
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/TamagometerDesktop.exe
            release/tamagometer_enhanced.fap
            release/THIRD_PARTY_NOTICES.md
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
          body_path: release/RELEASE_NOTES.md
          generate_release_notes: false
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
